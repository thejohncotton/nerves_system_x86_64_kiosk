# Early UEFI GRUB config.
#
# bootx64.efi is built with prefix=/EFI/BOOT, so the firmware loads this file as
# /EFI/BOOT/grub.cfg from the EFI System Partition. Its only job is to locate the
# Nerves boot partition (the FAT partition holding /boot/grub/grub.cfg) and hand off
# to the real boot script, so the A/B failover logic and grubenv stay in one place
# shared with the BIOS boot path.
search --no-floppy --set=root --file /boot/grub/grub.cfg
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
