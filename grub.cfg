# Firmware boot script
#
# This script expects the following Grub2 modules to be compiled
# into the grub binary (grub.img):
#
# boot linux squash4 ext2 fat part_msdos normal biosdisk loadenv echo true test
#

# Load the environment for the validation/fallback settings
# (image validation/fallback not added here yet...)
load_env

# Derive the boot disk from $root so this same script works under BIOS GRUB
# (prefix sets $root=hd0,msdos1) and UEFI GRUB (early cfg sets $root to the ESP).
# $root looks like "hd0,msdos1" -> capture "hd0".
regexp --set=1:disk '^([^,]+),' "$root"
if [ -z "$disk" ]; then disk=hd0 ; fi

# F9B Pro DSI panel is mounted rotated (native scanout 800x1280 portrait; the kiosk
# is landscape). `fbcon=rotate:1` rotates the *boot text console* 90° CW. The real
# kiosk rotation is done by the Wayland compositor's output transform (set in the
# cage/weston config in the browser layer) plus a matching libinput touch transform.
# `1` is a starting guess — tune on the device (0/1/2/3 = 0/90/180/270).

# snd_intel_dspcfg.dsp_driver=1 forces the legacy HDA driver: the kernel has no
# SOF DSP firmware, and on Alder Lake-N dsp_config would otherwise defer to SOF
# and leave the internal audio driverless.

# Boot A or B depending on which one is active
if [ $boot = 1 ]; then
     linux ($disk,msdos3)/boot/bzImage root=PARTUUID=04030201-03 rootwait console=ttyS0 video=efifb:off i915.enable_guc=0 i915.fastboot=0 snd_intel_dspcfg.dsp_driver=1
else
     linux ($disk,msdos2)/boot/bzImage root=PARTUUID=04030201-02 rootwait console=ttyS0 video=efifb:off i915.enable_guc=0 i915.fastboot=0 snd_intel_dspcfg.dsp_driver=1
fi

# Boot!!!
boot
